name: Lint mix project

on:
  workflow_call:
    inputs:
      elixirs:
        type: string
        default: "[\"1.19.x\"]"
      erlangs:
        type: string
        default: "[\"28.x\"]"
      apt-packages:
        type: string
        default: ""

env:
  MIX_ENV: test

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        elixir: ${{ fromJSON(inputs.elixirs) }}
        otp: ${{ fromJSON(inputs.erlangs) }}
    steps:
    - name: Install apt packages
      if: inputs.apt-packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ inputs.apt-packages }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    - name: Disable compile warnings
      run: echo "::remove-matcher owner=elixir-mixCompileWarning::"
    - name: Retrieve mix dependencies cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: mix-cache
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-
    - name: Install mix dependencies
      if: steps.mix-cache.outputs.cache-hit != 'true'
      run: |
        mix deps.get
        mix deps.compile
    - name: Compile code
      run: mix compile --warnings-as-errors
    - name: Check for unused dependencies
      run: mix deps.unlock --check-unused
    - name: Check formatting
      run: mix format --check-formatted
    - name: Run credo
      run: mix credo --strict
    - name: Retrieve PLT cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: plt-cache
      with:
        path: priv/plts
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-plts-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-plts-
    - name: Create PLTs
      run: |
        mkdir -p priv/plts
        mix dialyzer --plt
    - name: Run dialyzer
      id: dialyzer
      continue-on-error: true
      run: mix dialyzer --format github
    - name: Evict stale PLT cache and retry dialyzer
      if: steps.dialyzer.outcome == 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Dialyzer failed; evicting stale PLT caches and retrying..."
        PLT_KEY_PREFIX="${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-plts-"
        gh cache list \
          --repo "${{ github.repository }}" \
          --key "$PLT_KEY_PREFIX" \
          --json key \
          --jq '.[].key' | \
        while IFS= read -r cache_key; do
          echo "Evicting cache: $cache_key"
          gh cache delete "$cache_key" --repo "${{ github.repository }}" || true
        done
        rm -rf priv/plts
        mkdir -p priv/plts
        mix dialyzer --plt
        mix dialyzer --format github
